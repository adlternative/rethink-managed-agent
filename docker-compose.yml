services:
  postgres:
    image: postgres:16-alpine   # PolarDB-PG is wire compatible; swap image/DATABASE_URL to use it
    environment: { POSTGRES_USER: pi, POSTGRES_PASSWORD: pi, POSTGRES_DB: pi }
    ports: ["${PG_HOST_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U pi"], interval: 2s, retries: 30 }
  redis:
    image: redis:7-alpine
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 2s, retries: 30 }
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: pma, MINIO_ROOT_PASSWORD: pma-secret }
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: ["minio:/data"]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 3s, retries: 30 }
  api:
    build: .
    command: ["npm", "run", "api"]
    environment:
      DATABASE_URL: postgres://pi:pi@postgres:5432/pi
      REDIS_URL: redis://redis:6379
      PLUGIN_ALLOW: /app/plugins/   # deployed default: only bundled plugins may run on the runner
      COMPAT_TEAM_PACKAGE: /app/plugins/team
      COMPAT_WEBSEARCH_PACKAGE: /app/plugins/web-search
      API_PORT: "8080"
      QODER_BASE_URL: http://host.docker.internal:4141/v1   # seeded provider must be reachable from the runner
      QODER_API_KEY: ${QODER_API_KEY:-qoder}
      BLOB_ENDPOINT: http://minio:9000
      BLOB_BUCKET: pma
      BLOB_ACCESS_KEY: pma
      BLOB_SECRET_KEY: pma-secret
      PMA_SECRET_KEY: ${PMA_SECRET_KEY:-}
    ports: ["${API_PORT:-8080}:8080"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy }, minio: { condition: service_healthy } }
  runner:
    build: .
    command: ["npm", "run", "runner"]
    environment:
      DATABASE_URL: postgres://pi:pi@postgres:5432/pi
      REDIS_URL: redis://redis:6379
      PLUGIN_ALLOW: /app/plugins/   # deployed default: only bundled plugins may run on the runner
      QODER_BASE_URL: http://host.docker.internal:4141/v1
      QODER_API_KEY: ${QODER_API_KEY:-qoder}   # placeholder; the proxy ignores it, pi-ai requires a non-empty key
      BLOB_ENDPOINT: http://minio:9000
      BLOB_BUCKET: pma
      BLOB_ACCESS_KEY: pma
      BLOB_SECRET_KEY: pma-secret
      PMA_SECRET_KEY: ${PMA_SECRET_KEY:-}      # 32-byte base64/hex; seals BYOK provider keys at rest
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SANDBOX_DEFAULT_PROVIDER: ${SANDBOX_DEFAULT_PROVIDER:-local}
      E2B_API_KEY: ${E2B_API_KEY:-}
      E2B_TEMPLATE: ${E2B_TEMPLATE:-base}
      SANDBOX_LOCAL_ROOT: /data/sandboxes
      PI_AGENT_ROOT: /data/pi-agents
      WORKSPACE_ROOT: /data/workspaces
      # Host path of the sandboxes bind mount below. The docker provider passes it to `docker run -v`
      # (the host daemon resolves bind mounts, so container paths would silently mount nothing).
      SANDBOX_HOST_ROOT: ${SANDBOX_HOST_ROOT:-${PWD}/data/sandboxes}
      SANDBOX_IDLE_TTL_MS: "600000"
      COMPACTION_RESERVE_TOKENS: ${COMPACTION_RESERVE_TOKENS:-16384}
      COMPACTION_KEEP_RECENT_TOKENS: ${COMPACTION_KEEP_RECENT_TOKENS:-20000}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ${SANDBOX_HOST_ROOT:-./data/sandboxes}:/data/sandboxes   # host bind (not a named volume) so sibling containers can mount workspaces
      - workspaces:/data/workspaces   # persistent `dir` workspaces; only the runner reads them
      - piagents:/data/pi-agents      # per-agent pi packages (extensions/skills/prompts)
      - /var/run/docker.sock:/var/run/docker.sock   # docker provider (sibling containers)
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy }, minio: { condition: service_healthy } }
volumes: { pgdata: {}, workspaces: {}, piagents: {}, minio: {} }
